[package]
name = "pdfcraft-atlas"
description = "Atlas Switch construction-drawing logic: layer grouping, takeoff marks, SHX text"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-annot = { workspace = true }
pdfcraft-print = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The paper sizes a printer's driver lists: the winprint craft-print already prints through, at the
# same revision so it resolves to the one patched copy in `vendor/winprint`.
winprint = { git = "https://github.com/storytold/winprint.rs", rev = "5f80b9baf6b58937c401656634e42d33f00ddf49", default-features = false }
