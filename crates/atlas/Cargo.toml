[package]
name = "pdfcraft-atlas"
description = "Atlas Switch construction-drawing logic: layer grouping, takeoff marks, SHX text"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-annot = { workspace = true }
pdfcraft-print = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The paper sizes a printer's driver lists: the winprint craft-print prints through, at its
# revision, which writes QName values the way drivers accept (storytold/pdfcraft#3823).
winprint = { git = "https://github.com/storytold/winprint.rs", rev = "bc06a7c48b768eb27a828c7986f6d2868b245ee0", default-features = false }
